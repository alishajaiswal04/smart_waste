<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Driver Route</title>
  <link rel="stylesheet" href="/css/styles.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Particle.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>

<body>
  <div id="particles-js"></div>

  <div class="sidebar">
    <h2>♻ SmartWaste</h2>
    <ul>
       <li><a href="driver.html" >Dashboard</a></li>
      <li><a href="driver-route.html" class="active">My Route</a></li>
      <li><a href="driver-pickups.html">Pickups</a></li>
      <li><a href="driver-alerts.html">Alerts</a></li>
      <li><a href="driver-history.html">History</a></li>
    </ul>
  </div>

  <div class="main">
    <div class="topbar">
      <h1>My Route</h1>
    </div>

    <div class="kpi-container">
      <div class="kpi-card glow"><h3>Route ID</h3><p id="routeId">--</p></div>
      <div class="kpi-card glow"><h3>Total Bins</h3><p id="totalBins">0</p></div>
      <div class="kpi-card glow"><h3>Estimated Distance</h3><p id="distance">--</p></div>
      <div class="kpi-card glow"><h3>Estimated Time</h3><p id="time">--</p></div>
    </div>

    <div class="card glow">
      <h2>Route Map</h2>
      <div id="routeMap" style="height:400px;"></div>
    </div>

    <div class="card glow">
      <h2>Route Stops</h2>
      <table>
        <thead>
          <tr>
            <th>Stop</th><th>Bin</th><th>Location</th><th>Coordinates</th><th>Status</th><th>Last Collected</th>
          </tr>
        </thead>
        <tbody id="routeStops">
          <!-- Route stops will be inserted dynamically from the backend
               based on AI model bin assignment to the logged-in driver -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="/js/driver-route.js"></script>
</body>
</html>
